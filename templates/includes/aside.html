<aside class="aside">
    <ul class="list-group">
      <a
        href="{% url 'library:books' %}"
        class="list-group-item d-flex justify-content-between align-items-center">
        Книги
          {% if books_count %}
            <span class="badge text-bg-primary rounded-pill">{{ books_count }}</span>
          {% endif %}
      </a>
      <a
        href="{% url 'library:authors' %}"
        class="list-group-item d-flex justify-content-between align-items-center">
        Авторы
          {% if authors_count %}
            <span class="badge text-bg-primary rounded-pill">{{ authors_count }}</span>
          {% endif %}
      </a>
        {% if user.is_authenticated and user.profile %}
          <a
            href="{% url 'userinfo:friends' %}"
            class="list-group-item d-flex justify-content-between align-items-center">
            <span class="me-auto">Друзья</span>
              {% if requests_count %}
                <span class="badge text-bg-danger text-white rounded-pill me-1">{{ requests_count }}</span>
              {% endif %}
              {% if friends_count %}
                <span class="badge text-bg-primary rounded-pill">{{ friends_count }}</span>
              {% endif %}
          </a>
        {% endif %}
    </ul>
</aside>
