{% extends 'base-user.html' %}

{% block title %}Книга | {{ book.title }}{% endblock %}

{% block main %}
    <h1 class="mt-3">{{ book.title }}</h1>

    <table class="table">
      <tbody>
        <tr>
          <th>Автор</th>
          <td>{{ book.author.username }}</td>
        </tr>
        <tr>
          <th>Дата создания</th>
          <td>{{ book.created_at }}</td>
        </tr>
      </tbody>
    </table>

    <div class="book-description mt-3">{{ book.description|safe }}</div>

    <div class="book-description mt-3">Часть книги</div>
{% endblock %}
