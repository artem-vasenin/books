{% extends 'base-guest.html' %}

{% block title %}Login page{% endblock %}

{% block main %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Login</label>
            <input name="username" type="text" class="form-control" id="username" aria-describedby="usernameHelp">
            <div id="usernameHelp" class="form-text">Ваш электронный ящик для входа в приложение</div>
        </div>
        <div class="mb-3">
            <label for="passwd" class="form-label">Password</label>
            <input name="password" type="password" class="form-control" id="passwd">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
{% endblock %}
